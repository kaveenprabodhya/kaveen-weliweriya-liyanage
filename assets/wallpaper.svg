  </g>

  <path d="M0,620 C 220,540 420,560 620,610 C 860,670 1000,560 1250,600 C 1400,624 1520,600 1600,580 L1600,1000 L0,1000 Z" fill="url(#hillFar)"/>
  <path d="M0,760 C 260,680 520,760 760,740 C 1000,720 1180,820 1400,780 C 1500,762 1560,750 1600,742 L1600,1000 L0,1000 Z" fill="url(#hillNear)"/>
